name: Build KAYAN Driver Android demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-driver-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out app
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install web dependencies
        run: npm install

      - name: Verify Google Maps API keys are configured
        run: |
          test -n "$VITE_GOOGLE_MAPS_API_KEY" || { echo "::error::Add the GOOGLE_MAPS_API_KEY repository secret for browser/Routes API requests."; exit 1; }
          test -n "$GOOGLE_MAPS_ANDROID_API_KEY" || { echo "::error::Add the GOOGLE_MAPS_ANDROID_API_KEY repository secret for the Android Maps SDK."; exit 1; }
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo "::error::Add the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret so the app-restricted Android Maps key matches this APK."; exit 1; }
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}

      - name: Validate optional Firebase configuration
        id: firebase_config
        run: |
          config_path="$RUNNER_TEMP/google-services.json"
          enabled=false
          if [ -z "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            echo "::warning::FIREBASE_ANDROID_CONFIG_BASE64 is not set; push notifications will be disabled in this APK."
          elif ! printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > "$config_path"; then
            rm -f "$config_path"
            echo "::warning::FIREBASE_ANDROID_CONFIG_BASE64 is invalid base64; push notifications will be disabled in this APK."
          elif ! node --input-type=module -e "import fs from 'node:fs'; const config = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, 'utf8')); if (!config.client?.some(item => item.client_info?.android_client_info?.package_name === 'com.kayan.driver.demo')) throw new Error('Firebase client package mismatch');" >/dev/null 2>&1; then
            rm -f "$config_path"
            echo "::warning::Firebase configuration is invalid or does not match com.kayan.driver.demo; push notifications will be disabled in this APK."
          else
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
          CONFIG_PATH: ${{ runner.temp }}/google-services.json

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias AndroidDebugKey >/dev/null
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}

      - name: Build standalone driver web app
        run: npm run build:driver
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ENABLE_LIVE_DISPATCH: ${{ vars.VITE_ENABLE_LIVE_DISPATCH }}
          VITE_ENABLE_DRIVER_PUSH_NOTIFICATIONS: ${{ steps.firebase_config.outputs.enabled }}

      - name: Select isolated driver packaging configuration
        run: |
          cp capacitor.driver.config.json capacitor.config.json
          node --input-type=module -e "import fs from 'node:fs'; const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8')); if (c.appId !== 'com.kayan.driver.demo' || c.webDir !== 'dist-driver') throw new Error('Driver package configuration mismatch'); if (!fs.existsSync('dist-driver/index.html')) throw new Error('Missing driver build');"

      - name: Install isolated Android packaging dependencies
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Generate Android project and bundle driver demo
        run: |
          npx --no-install cap add android
          npx --no-install cap sync android

      - name: Configure Firebase for Android push notifications
        run: |
          if [ "$FIREBASE_PUSH_ENABLED" = 'true' ]; then
            cp "$RUNNER_TEMP/google-services.json" android/app/google-services.json
          else
            echo "Push registration remains disabled; live offers are available while the driver app is open."
          fi
        env:
          FIREBASE_PUSH_ENABLED: ${{ steps.firebase_config.outputs.enabled }}

      - name: Apply foreground location permissions and KAYAN launcher icons
        run: node src/android/prepare-android.mjs
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

      - name: Compile driver debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

      - name: Upload driver test APK
        uses: actions/upload-artifact@v4
        with:
          name: KAYAN-Driver-Android-Demo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
